name: keep-warm

# Keeps the free Render instance from sleeping. Unlike UptimeRobot's short timeout,
# this curl waits out the full cold start (~50s), so it actually completes the wake.
# Free & unlimited on a PUBLIC repo (private repos have a 2000-min/month Actions cap).

on:
  schedule:
    - cron: "*/10 * * * *"        # every ~10 min (Render sleeps after 15 min idle)
  workflow_dispatch: {}            # also runnable manually from the Actions tab

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health (wait out cold start)
        run: |
          URL="https://fg-esports-prediction-okx.onrender.com/health"
          echo "pinging $URL ..."
          # --max-time 90 holds the connection through a cold start; retry a couple times.
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 5 "$URL" || echo "000")
          echo "HTTP $code"
          # keep-warm should not fail the run on a transient miss
          if [ "$code" = "200" ]; then echo "warm ✔"; else echo "not 200 (will retry next cycle)"; fi
